[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "schedule_builder"
version = "0.1.0"
description = "Automatic schedule generator and filter using constrain-satisfaction DFS and logical reasoning."
readme = "README.md"
dependencies = []

[project.scripts]
schebuilder = "schedule_builder.main:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
